<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#0B0D12;font-family:Inter,Arial,sans-serif;color:#f8fafc;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0B0D12;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:520px;background:#12151d;border:1px solid #232836;border-radius:20px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:-0.02em;">
                  Darasa<span style="color:#1E88E5;">X</span>
                </p>
                <h1 style="margin:16px 0 8px;font-size:24px;line-height:1.3;">Reset your password</h1>
                <p style="margin:0 0 20px;color:#9ca3af;font-size:15px;line-height:1.6;">
                  Use this verification code to continue resetting your DarasaX password:
                </p>
                <p style="margin:0 0 20px;font-size:36px;font-weight:700;letter-spacing:0.18em;color:#4FC3F7;">
                  {{ .Token }}
                </p>
                <p style="margin:0 0 20px;color:#9ca3af;font-size:14px;line-height:1.6;">
                  This code expires shortly. If you didn’t request a password reset, you can ignore this email.
                </p>
                <p style="margin:0;color:#64748b;font-size:13px;">
                  DarasaX<br />
                  Everything for class. One place.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
